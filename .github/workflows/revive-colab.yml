name: revive-colab

# Triggered by the Android app (repository_dispatch: revive) or manually.
#
# Boots a Colab T4, serves Mistral Small, and publishes endpoint.json so the app
# can reconnect on its own.
#
# Design note: the VM publishes the endpoint itself (serve.sh -> publish_endpoint.sh
# with a token handed over at boot). CI only watches the resulting file. Polling the
# VM via `colab exec` proved unreliable — `colab -s <alias>` did not resolve the
# session created by `colab new`, so the old wait loop spun forever.
on:
  repository_dispatch:
    types: [revive]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: colab-revive
  cancel-in-progress: true

jobs:
  revive:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Colab CLI
        run: |
          pip install -q google-colab-cli
          colab version

      - name: Restore credentials
        env:
          COLAB_TOKEN_JSON: ${{ secrets.COLAB_TOKEN_JSON }}
        run: |
          mkdir -p ~/.config/colab-cli
          printf '%s' "$COLAB_TOKEN_JSON" > ~/.config/colab-cli/token.json
          chmod 600 ~/.config/colab-cli/token.json
          python colab-gpu-env/scripts/patch_scopes.py
          colab whoami
          colab usage

      - name: Provision T4
        run: |
          colab new --gpu T4
          colab sessions

      - name: Boot stack on the VM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          tar czf /tmp/cge.tgz colab-gpu-env
          colab upload /tmp/cge.tgz /content/cge.tgz
          printf '%s' "$GH_TOKEN" > /tmp/tok
          colab upload /tmp/tok /content/.ghtoken
          cat > /tmp/boot.py <<'PY'
          import os
          import subprocess
          tok = open("/content/.ghtoken").read().strip()
          env = dict(os.environ)
          env["GITHUB_TOKEN"] = tok
          env["PUBLISH_REPO"] = os.environ.get("PUBLISH_REPO", "")
          env["PUBLISH_PATH"] = "endpoint.json"
          subprocess.Popen(
              "cd /content && tar xzf cge.tgz && chmod +x colab-gpu-env/*.sh && "
              "bash colab-gpu-env/setup.sh > /content/setup.log 2>&1 && "
              "bash colab-gpu-env/serve.sh > /content/serve.log 2>&1",
              shell=True, env=env, start_new_session=True,
              stdout=open("/content/boot.log", "w"),
              stderr=subprocess.STDOUT)
          print("boot started")
          PY
          cat > /tmp/run.py <<'PY'
          import os
          import re
          path = "/tmp/boot.py"
          src = open(path).read()
          src = src.replace('os.environ.get("PUBLISH_REPO", "")',
                            repr(os.environ.get("REPO", "")))
          open("/tmp/boot2.py", "w").write(src)
          print("prepared")
          PY
          python3 /tmp/run.py
          colab exec -f /tmp/boot2.py

      - name: Wait for the VM to publish the endpoint
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          START=$(date +%s)
          for i in $(seq 1 85); do
            curl -sS -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/contents/endpoint.json?ref=main" \
              -o /tmp/ep.json || true
            DONE=$(python3 -c "
          import base64, json, sys
          try:
              d = json.load(open('/tmp/ep.json'))
              doc = json.loads(base64.b64decode(d['content']))
              print('yes' if int(doc.get('updated_at', 0)) >= int(sys.argv[1]) else 'no')
          except Exception:
              print('no')
          " "$START")
            echo "poll $i: published=$DONE"
            if [ "$DONE" = "yes" ]; then echo "endpoint published"; exit 0; fi
            sleep 20
          done
          echo "VM never published an endpoint" >&2
          exit 1

      - name: Keep runtime alive
        if: success()
        run: |
          for i in $(seq 1 66); do
            sleep 300
            echo "heartbeat $i $(date -u +%H:%M)"
          done

      - name: Teardown
        if: always()
        run: colab stop || true
