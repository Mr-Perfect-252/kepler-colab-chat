name: revive-colab

# Triggered by the Android app (repository_dispatch: revive) or manually.
# Boots a Colab T4, serves Mistral Small, publishes endpoint.json so the app can
# reconnect, then babysits the runtime until the job limit.
#
# No `colab -s <alias>`: aliases resolve from the runner-local sessions.json and
# an alias made by `colab new` was not resolvable by later steps. With a single
# active session the CLI resolves it automatically.
on:
  repository_dispatch:
    types: [revive]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: colab-revive
  cancel-in-progress: true

jobs:
  revive:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Colab CLI
        run: |
          pip install -q google-colab-cli
          colab version

      - name: Restore credentials
        env:
          COLAB_TOKEN_JSON: ${{ secrets.COLAB_TOKEN_JSON }}
        run: |
          mkdir -p ~/.config/colab-cli
          printf '%s' "$COLAB_TOKEN_JSON" > ~/.config/colab-cli/token.json
          chmod 600 ~/.config/colab-cli/token.json
          python colab-gpu-env/scripts/patch_scopes.py
          colab whoami
          colab usage

      - name: Provision T4
        run: |
          colab new --gpu T4
          colab sessions

      - name: Upload bundle and start stack
        run: |
          tar czf /tmp/cge.tgz colab-gpu-env
          colab upload /tmp/cge.tgz /content/cge.tgz
          cat > /tmp/boot.py <<'PY'
          import subprocess
          subprocess.Popen(
              "cd /content && tar xzf cge.tgz && chmod +x colab-gpu-env/*.sh && "
              "( bash colab-gpu-env/setup.sh && bash colab-gpu-env/serve.sh ) "
              "> /content/boot.log 2>&1 < /dev/null &",
              shell=True)
          print("boot started")
          PY
          colab exec -f /tmp/boot.py

      - name: Wait for tunnel
        timeout-minutes: 30
        run: |
          for i in $(seq 1 90); do
            colab exec -f colab-gpu-env/scripts/status.py > /tmp/raw.txt 2>&1 || true
            grep -E '^\{' /tmp/raw.txt | tail -1 > /tmp/status.json || true
            URL=$(python3 -c "import json;print(json.load(open('/tmp/status.json')).get('url',''))" 2>/dev/null || echo "")
            echo "[$i] url=${URL:-none}"
            if [ -n "$URL" ]; then echo "tunnel up: $URL"; exit 0; fi
            sleep 20
          done
          echo "no tunnel after 30 min; last probe:"
          cat /tmp/raw.txt
          exit 1

      - name: Publish endpoint
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/publish.py <<'PY'
          import json
          import time
          st = json.load(open("/tmp/status.json"))
          assert st["url"], "no url in status"
          doc = {
              "base_url": st["url"],
              "api_key": st["api_key"],
              "model": "mistral-small-3.1-24b",
              "updated_at": int(time.time()),
              "session": "actions",
          }
          json.dump(doc, open("/tmp/endpoint.json", "w"), indent=2)
          print("endpoint:", doc["base_url"], "| gpu:", st.get("gpu"))
          PY
          python3 /tmp/publish.py

          CONTENT=$(base64 -w0 /tmp/endpoint.json)
          SHA=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/contents/endpoint.json" | python3 -c "import json,sys;print(json.load(sys.stdin).get('sha',''))" 2>/dev/null || true)
          cat > /tmp/put.py <<'PY'
          import json
          import sys
          doc = {"message": "chore: publish colab endpoint",
                 "content": sys.argv[1], "branch": "main"}
          if sys.argv[2]:
              doc["sha"] = sys.argv[2]
          print(json.dumps(doc))
          PY
          BODY=$(python3 /tmp/put.py "$CONTENT" "$SHA")
          curl -sS -X PUT -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" -d "$BODY" \
            "https://api.github.com/repos/${{ github.repository }}/contents/endpoint.json" \
            -o /dev/null -w "publish HTTP %{http_code}\n"

      - name: Keep runtime alive
        if: success()
        run: |
          for i in $(seq 1 66); do
            sleep 300
            echo "heartbeat $i $(date -u +%H:%M)"
          done

      - name: Teardown
        if: always()
        run: colab stop || true
