name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      # Credentials are injected here, never committed. Blank in source means a
      # fork builds a working app that simply has no baked endpoint.
      - name: Inject build config from secrets
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          BOOTSTRAP_URL: ${{ secrets.BOOTSTRAP_URL }}
          BOOTSTRAP_KEY: ${{ secrets.BOOTSTRAP_KEY }}
          RENDEZVOUS_URL: ${{ secrets.RENDEZVOUS_URL }}
        run: |
          {
            echo "GH_PAT=${GH_PAT}"
            echo "BOOTSTRAP_URL=${BOOTSTRAP_URL}"
            echo "BOOTSTRAP_KEY=${BOOTSTRAP_KEY}"
            echo "RENDEZVOUS_URL=${RENDEZVOUS_URL}"
            echo "GH_REPO=${GITHUB_REPOSITORY}"
          } >> gradle.properties
          echo "injected $(wc -l < gradle.properties) property lines"

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: colab-chat-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
